<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مركز الأخبار المباشر</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; }
        body { background: #0f172a; color: #f8fafc; padding: 16px; min-height: 100vh; }
        .container { max-width: 850px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 20px; }
        header h1 { font-size: 22px; font-weight: 700; color: #38bdf8; margin-bottom: 6px; }
        header p { font-size: 13px; color: #94a3b8; }
        
        .search-bar { display: flex; gap: 8px; margin-bottom: 20px; }
        .search-bar input { flex: 1; padding: 14px 16px; border-radius: 12px; border: 1px solid #334155; background: #1e293b; color: #fff; font-size: 15px; outline: none; transition: 0.2s; }
        .search-bar input:focus { border-color: #38bdf8; box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2); }
        .search-bar button { padding: 0 22px; background: #2563eb; color: #fff; border: none; border-radius: 12px; font-weight: 600; cursor: pointer; transition: 0.2s; white-space: nowrap; }
        .search-bar button:active { transform: scale(0.97); }

        .tabs-wrapper { overflow-x: auto; white-space: nowrap; margin-bottom: 20px; padding-bottom: 6px; -webkit-overflow-scrolling: touch; }
        .tabs { display: inline-flex; gap: 8px; }
        .tab-btn { background: #1e293b; border: 1px solid #334155; color: #94a3b8; padding: 9px 18px; border-radius: 25px; cursor: pointer; font-size: 14px; font-weight: 500; transition: 0.2s; }
        .tab-btn.active { background: #38bdf8; color: #0f172a; border-color: #38bdf8; font-weight: 700; }

        #status-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; font-size: 13px; color: #64748b; }
        #loading { display: none; text-align: center; padding: 30px; font-weight: 600; color: #38bdf8; }

        .news-grid { display: flex; flex-direction: column; gap: 12px; }
        .news-card { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 16px; transition: transform 0.15s, border-color 0.15s; }
        .news-card:hover { border-color: #475569; transform: translateY(-1px); }
        .news-card a { font-size: 16px; font-weight: 600; color: #f1f5f9; text-decoration: none; line-height: 1.5; display: block; margin-bottom: 10px; }
        .news-card a:hover { color: #38bdf8; }
        
        .news-meta { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #94a3b8; }
        .news-source { background: #0f172a; padding: 3px 10px; border-radius: 6px; color: #38bdf8; border: 1px solid #1e293b; }
        .empty-msg { text-align: center; padding: 40px; color: #64748b; font-size: 15px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>مركز الأخبار الفوري</h1>
        <p>متابعة وتحديث حي لكافة المصادر الإخبارية والبحث المباشر</p>
    </header>

    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="ابحث مباشرة عن أي موضوع أو شخصية...">
        <button onclick="performSearch()">ابحث الآن</button>
    </div>

    <div class="tabs-wrapper">
        <div class="tabs" id="tabsList"></div>
    </div>

    <div id="status-bar">
        <span id="activeSection">الأخبار</span>
        <span id="articlesCount"></span>
    </div>

    <div id="loading">جارٍ جلب الأخبار...</div>
    <div class="news-grid" id="newsGrid"></div>
</div>

<script>
    let feeds = {};

    async function init() {
        document.getElementById('loading').style.display = 'block';
        try {
            const res = await fetch('/api/feed');
            feeds = await res.json();
            renderTabs();
            const categories = Object.keys(feeds);
            if (categories.length > 0) {
                switchCategory(categories[0]);
            }
        } catch (err) {
            document.getElementById('newsGrid').innerHTML = '<div class="empty-msg">تعذر الاتصال بالخادم، يرجى تحديث الصفحة.</div>';
        }
        document.getElementById('loading').style.display = 'none';
    }

    function renderTabs() {
        const list = document.getElementById('tabsList');
        list.innerHTML = '';
        Object.keys(feeds).forEach((cat, index) => {
            const btn = document.createElement('button');
            btn.className = 'tab-btn' + (index === 0 ? ' active' : '');
            btn.textContent = cat;
            btn.onclick = () => switchCategory(cat);
            list.appendChild(btn);
        });
    }

    function switchCategory(category) {
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.classList.toggle('active', btn.textContent === category);
        });
        document.getElementById('activeSection').textContent = category;
        const items = feeds[category] || [];
        renderArticles(items);
    }

    async function performSearch() {
        const query = document.getElementById('searchInput').value.trim();
        if (!query) return;

        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById('activeSection').textContent = `نتائج البحث عن: "${query}"`;
        document.getElementById('newsGrid').innerHTML = '';
        document.getElementById('loading').style.display = 'block';

        try {
            const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
            const data = await res.json();
            renderArticles(data.results || []);
        } catch (e) {
            document.getElementById('newsGrid').innerHTML = '<div class="empty-msg">حدث خطأ أثناء إجراء البحث المباشر.</div>';
        }
        document.getElementById('loading').style.display = 'none';
    }

    function renderArticles(items) {
        const grid = document.getElementById('newsGrid');
        const countSpan = document.getElementById('articlesCount');
        countSpan.textContent = items.length ? `${items.length} خبر` : '';

        if (!items || items.length === 0) {
            grid.innerHTML = '<div class="empty-msg">لا توجد أخبار متاحة حالياً.</div>';
            return;
        }

        grid.innerHTML = items.map(item => `
            <div class="news-card">
                <a href="${item.link}" target="_blank" rel="noopener noreferrer">${item.title}</a>
                <div class="news-meta">
                    <span class="news-source">${item.source || 'أخبار'}</span>
                    <span>${item.pubDate ? item.pubDate.slice(0, 16) : ''}</span>
                </div>
            </div>
        `).join('');
    }

    document.getElementById('searchInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') performSearch();
    });

    init();
</script>

</body>
</html>

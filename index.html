<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>غرفة الإخبارية اللبنانية | Lebanese Newsroom</title>
    <style>
        :root {
            --bg-main: #0a0e17;
            --bg-card: #111827;
            --bg-card-hover: #162032;
            --red-primary: #e11d48;
            --red-glow: rgba(225, 29, 72, 0.25);
            --green-cedar: #16a34a;
            --green-glow: rgba(22, 163, 74, 0.2);
            --text-light: #f8fafc;
            --text-gray: #94a3b8;
            --border-dim: #1f293d;
            --gold-accent: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        body { background: var(--bg-main); color: var(--text-light); padding: 12px; min-height: 100vh; }
        .container { max-width: 900px; margin: 0 auto; }

        /* الترويسة وهوية الإخبارية اللبنانية */
        header { 
            background: linear-gradient(180deg, #111827 0%, #0d131f 100%); 
            border: 1px solid var(--border-dim); 
            border-radius: 14px; 
            padding: 16px 20px; 
            margin-bottom: 16px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }
        .brand-container { display: flex; align-items: center; gap: 14px; }
        .logo-emblem { width: 50px; height: 50px; flex-shrink: 0; filter: drop-shadow(0 0 8px rgba(225, 29, 72, 0.4)); }
        
        .brand-titles h1 { font-size: 20px; font-weight: 800; color: #22c55e; letter-spacing: -0.5px; display: flex; align-items: center; gap: 8px; }
        .brand-titles .en-brand { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; margin-top: 2px; }
        .brand-titles .en-red { color: #f43f5e; }
        .brand-titles .en-green { color: #22c55e; }

        .desk-info { text-align: left; }
        .time-box { font-size: 18px; font-weight: 800; color: #fff; font-variant-numeric: tabular-nums; }
        .time-lbl { font-size: 11px; color: var(--text-gray); }

        /* شريط الجولة والمؤقت */
        .status-strip {
            background: #131c2e;
            border-right: 4px solid var(--red-primary);
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .status-title { font-size: 13px; font-weight: 600; color: #e2e8f0; }
        .status-sub { font-size: 11px; color: var(--text-gray); margin-top: 2px; }
        .next-timer { text-align: left; background: rgba(0,0,0,0.3); padding: 4px 12px; border-radius: 6px; border: 1px solid var(--border-dim); }
        .next-timer-val { font-size: 15px; font-weight: 700; color: var(--gold-accent); }

        /* حقل البحث التحريري */
        .search-area { display: flex; gap: 8px; margin-bottom: 16px; }
        .search-area input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid var(--border-dim);
            background: #111827;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border 0.2s;
        }
        .search-area input:focus { border-color: var(--green-cedar); box-shadow: 0 0 0 2px var(--green-glow); }
        .btn-search {
            background: linear-gradient(135deg, #e11d48, #be123c);
            color: #fff;
            border: none;
            padding: 0 22px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 2px 10px var(--red-glow);
        }

        /* تبويبات الفرز */
        .tabs { display: flex; gap: 8px; border-bottom: 1px solid var(--border-dim); padding-bottom: 10px; margin-bottom: 16px; }
        .tab-btn {
            background: #111827;
            border: 1px solid var(--border-dim);
            color: var(--text-gray);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .tab-btn.active { background: var(--green-cedar); color: #fff; border-color: var(--green-cedar); box-shadow: 0 0 12px var(--green-glow); }
        .counter-badge { background: rgba(0,0,0,0.3); font-size: 10px; padding: 2px 6px; border-radius: 10px; margin-right: 4px; }

        /* بطاقة المادة الإخبارية المحررة */
        .news-card {
            background: var(--bg-card);
            border: 1px solid var(--border-dim);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.25);
            transition: transform 0.15s, border-color 0.15s;
        }
        .news-card:hover { border-color: #334155; transform: translateY(-1px); }
        
        .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .badge-beqaa {
            background: #e11d48;
            color: #fff;
            font-size: 11px;
            font-weight: 800;
            padding: 3px 10px;
            border-radius: 6px;
            box-shadow: 0 0 10px var(--red-glow);
            letter-spacing: 0.3px;
        }
        .badge-status { font-size: 11px; color: var(--gold-accent); background: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.2); padding: 3px 8px; border-radius: 6px; }

        .headline { font-size: 16px; font-weight: 700; color: #f1f5f9; line-height: 1.5; margin-bottom: 12px; }
        
        /* أدوات النسخ الفوري */
        .copy-actions { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
        .btn-copy {
            background: #1e293b;
            border: 1px solid #334155;
            color: #cbd5e1;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-copy:hover { background: #334155; color: #fff; }
        .btn-copy.urgent-copy { border-color: #9f1239; color: #fda4af; }
        .btn-copy.urgent-copy:hover { background: #be123c; color: #fff; }

        .article-text { font-size: 13px; line-height: 1.7; color: #cbd5e1; margin-bottom: 12px; background: #0c1322; padding: 12px; border-radius: 8px; border-right: 3px solid var(--green-cedar); }
        
        .box-urgent {
            background: rgba(225, 29, 72, 0.08);
            border: 1px solid rgba(225, 29, 72, 0.25);
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 10px;
            font-size: 12px;
            color: #fecdd3;
        }
        .box-urgent strong { color: #f43f5e; margin-left: 6px; }

        .followup-box { background: #0c1322; border: 1px solid var(--border-dim); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }
        .followup-box-title { font-size: 11px; font-weight: 700; color: var(--gold-accent); margin-bottom: 6px; }
        .followup-list { list-style: none; font-size: 11px; color: var(--text-gray); }
        .followup-list li { margin-bottom: 3px; position: relative; padding-right: 12px; }
        .followup-list li::before { content: "▪"; position: absolute; right: 0; color: var(--red-primary); }

        .source-footer { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--text-gray); border-top: 1px solid var(--border-dim); padding-top: 8px; }
        .source-footer a { color: #38bdf8; text-decoration: none; font-weight: 600; }

        #desk-status { text-align: center; padding: 30px; color: var(--text-gray); font-size: 13px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="brand-container">
            <!-- الشعار التلفزيوني المتقن بالـ SVG -->
            <svg class="logo-emblem" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- الدائرة الحمراء الخارجية -->
                <circle cx="100" cy="100" r="88" stroke="#e11d48" stroke-width="14" fill="#0d111a"/>
                <!-- الفصام / النقطتان المعدنيتان الجانبيتان -->
                <circle cx="36" cy="100" r="10" fill="#64748b" stroke="#e2e8f0" stroke-width="3"/>
                <circle cx="164" cy="100" r="10" fill="#64748b" stroke="#e2e8f0" stroke-width="3"/>
                <!-- الجناحان الأحمران -->
                <path d="M72 135C62 105 72 65 92 48C76 72 74 112 88 148C82 144 76 140 72 135Z" fill="#e11d48"/>
                <path d="M128 135C138 105 128 65 108 48C124 72 126 112 112 148C118 144 124 140 128 135Z" fill="#e11d48"/>
                <!-- شفرة الأرزة الخضراء في المنتصف -->
                <path d="M100 42C108 75 106 125 94 158C92 125 94 75 100 42Z" fill="#22c55e"/>
            </svg>
            <div class="brand-titles">
                <h1>الإخبارية اللبنانية</h1>
                <div class="en-brand"><span class="en-red">LEBANESE</span> <span class="en-green">NEWS</span> | غرفة الرصد والتحرير</div>
            </div>
        </div>
        <div class="desk-info">
            <div class="time-box" id="beirutTime">--:--:--</div>
            <div class="time-lbl">توقيت بيروت</div>
        </div>
    </header>

    <div class="status-strip">
        <div>
            <div class="status-title">النشرة المجدولة لغرفة التحرير</div>
            <div class="status-sub">أولوية الرصد والفرز: بلدات وقرى محافظة البقاع وبعلبك والهرمل</div>
        </div>
        <div class="next-timer">
            <div class="status-sub" style="font-size: 10px;">الجولة التالية خلال</div>
            <div class="next-timer-val" id="timerNext">--:--</div>
        </div>
    </div>

    <div class="search-area">
        <input type="text" id="searchInput" placeholder="ابحث مباشرة عن أي حدث، أو بلدة في البقاع...">
        <button class="btn-search" onclick="searchLive()">بحث فوري</button>
    </div>

    <div class="tabs">
        <button class="tab-btn active" id="tabBeqaa" onclick="setTab('beqaa')">رصد البقاع <span class="counter-badge" id="cBeqaa">0</span></button>
        <button class="tab-btn" id="tabAll" onclick="setTab('all')">كافة التغطيات اللبنانية <span class="counter-badge" id="cAll">0</span></button>
    </div>

    <div id="newsFeed">
        <div id="desk-status">جارٍ الاتصال بمحرك الرصد والتحرير...</div>
    </div>
</div>

<script>
    let articles = [];
    let currentTab = 'beqaa';
    let timeLeft = 0;

    function runClock() {
        const d = new Date();
        document.getElementById('beirutTime').textContent = d.toLocaleTimeString('ar-LB', { hour12: false });
    }
    setInterval(runClock, 1000);
    runClock();

    function startCountdown() {
        setInterval(() => {
            if (timeLeft > 0) {
                timeLeft--;
                const m = String(Math.floor(timeLeft / 60)).padStart(2, '0');
                const s = String(timeLeft % 60).padStart(2, '0');
                document.getElementById('timerNext').textContent = `${m}:${s}`;
            } else {
                document.getElementById('timerNext').textContent = "جارٍ التحديث...";
            }
        }, 1000);
    }

    async function loadData() {
        try {
            const res = await fetch('/api/feed');
            const data = await res.json();
            articles = data.articles || [];
            timeLeft = data.next_run_seconds || 3600;
            renderArticles();
        } catch(e) {
            document.getElementById('newsFeed').innerHTML = `
                <div id="desk-status" style="color: #f87171;">
                    تعذر الاتصال بالخادم. يرجى الانتظار دقيقة حتى يستيقظ السيرفر ثم أعد التحديث.
                    <br><button onclick="loadData()" style="margin-top:10px; padding:6px 14px; background:#1e293b; color:#fff; border:1px solid #475569; border-radius:6px; cursor:pointer;">إعادة المحاولة</button>
                </div>
            `;
        }
    }

    function setTab(tab) {
        currentTab = tab;
        document.getElementById('tabBeqaa').classList.toggle('active', tab === 'beqaa');
        document.getElementById('tabAll').classList.toggle('active', tab === 'all');
        renderArticles();
    }

    function renderArticles() {
        const feed = document.getElementById('newsFeed');
        const beqaaList = articles.filter(a => a.is_beqaa);
        document.getElementById('cBeqaa').textContent = beqaaList.length;
        document.getElementById('cAll').textContent = articles.length;

        const displayed = currentTab === 'beqaa' ? beqaaList : articles;

        if (displayed.length === 0) {
            feed.innerHTML = '<div id="desk-status">لا توجد مواد مسجلة ضمن هذا القسم في الوقت الحالي.</div>';
            return;
        }

        feed.innerHTML = displayed.map(a => `
            <div class="news-card">
                <div class="card-top">
                    <div>
                        ${a.is_beqaa ? '<span class="badge-beqaa">رصد البقاع المباشر</span>' : ''}
                    </div>
                    <span class="badge-status">${a.status_label || 'مسودة محررة'}</span>
                </div>
                
                <div class="headline">${a.headline}</div>

                <div class="copy-actions">
                    <button class="btn-copy" onclick="copySnippet(this, '${escapeText(a.editorial_body)}')">نسخ نص المادة</button>
                    <button class="btn-copy urgent-copy" onclick="copySnippet(this, '${escapeText(a.urgent_text)}')">نسخ عاجل</button>
                    <button class="btn-copy" onclick="copySnippet(this, '${escapeText(a.social_text)}')">نسخ للسوشيال</button>
                </div>

                <div class="article-text">${a.editorial_body}</div>

                <div class="box-urgent">
                    <strong>شريط عاجل:</strong> ${a.urgent_text}
                </div>

                <div class="followup-box">
                    <div class="followup-box-title">إجراءات التحقق والمتابعة التحريرية:</div>
                    <ul class="followup-list">
                        ${(a.followups || []).map(f => `<li>${f}</li>`).join('')}
                    </ul>
                </div>

                <div class="source-footer">
                    <span>المصدر المرصود: <strong>${a.source}</strong></span>
                    <a href="${a.link}" target="_blank" rel="noopener">فتح الرابط الأصلي ↗</a>
                </div>
            </div>
        `).join('');
    }

    function escapeText(str) {
        return (str || '').replace(/'/g, "\\'").replace(/\n/g, "\\n");
    }

    function copySnippet(btn, text) {
        navigator.clipboard.writeText(text);
        const original = btn.textContent;
        btn.textContent = "تم النسخ ✓";
        btn.style.borderColor = "#22c55e";
        setTimeout(() => {
            btn.textContent = original;
            btn.style.borderColor = "";
        }, 1500);
    }

    async function searchLive() {
        const query = document.getElementById('searchInput').value.trim();
        if (!query) return;

        document.getElementById('newsFeed').innerHTML = '<div id="desk-status">جارٍ البحث الفوري في مصادر الرصد وصياغة النتائج...</div>';
        try {
            const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
            const data = await res.json();
            articles = data.results || [];
            currentTab = 'all';
            document.getElementById('tabAll').classList.add('active');
            document.getElementById('tabBeqaa').classList.remove('active');
            renderArticles();
        } catch(e) {
            alert('حدث خطأ أثناء إجراء البحث المباشر');
        }
    }

    document.getElementById('searchInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') searchLive();
    });

    startCountdown();
    loadData();
</script>

</body>
</html>
